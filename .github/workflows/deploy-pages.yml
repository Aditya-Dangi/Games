name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npx ng build --base-href /Games/

      # GitHub Pages has no server-side rewrites, so give it an
      # index.html-flavored 404 page for the Angular router to boot from
      # on any deep link (e.g. /Games/sudoku) or hard refresh.
      - run: |
          cp dist/games-hub/browser/index.html dist/games-hub/browser/404.html
          touch dist/games-hub/browser/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/games-hub/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
